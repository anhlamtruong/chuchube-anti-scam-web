<!doctype html>
<!--
  Chuchube check flow: an 8 s seamless web loop, 800x1000 (4:5), 30 fps, no audio.
  One standalone composition, two languages: the root variable `lang` (vi | en) picks the strings.
  Render English with --variables '{"lang":"en"}' (a root-level variable; sub-composition scripts
  only see their own scoped variables, which is why this is a single file).
  Everything on screen is a pure function of t (renderAt), so renderAt(8) === renderAt(0).
  Frame 0 is the poster: the finished result screen, just before "Chuchube!" is pressed.
  Tokens: ../DESIGN.md. Render + encode: ../README.md.
-->
<html
  lang="vi"
  data-composition-variables='[{"id":"lang","type":"enum","label":"Language","default":"vi","options":[{"value":"vi","label":"Tiếng Việt"},{"value":"en","label":"English"}]}]'

  <body>

    <script>
      (function () {
        const DUR = 8;

        // ---- Strings: one composition, two languages (variable `lang`) ----
        const STRINGS = {
          vi: {
            shotLabel: "Ảnh chụp màn hình",
            fakeName: "Bếp của Mơ - Tri Ân",
            post: "Góp vốn cùng Mơ, lãi 30% mỗi tuần!",
            checking: "Đang kiểm tra",
            pctLabel: "khả năng giả mạo",
            reason1: "Tạo 6 ngày trước",
            reason2: "Tên gần giống trang chính thức",
            reason3: "Hứa lãi bất thường",
            officialTitle: "Kênh chính thức",
            officialName: "Bếp của Mơ",
            followers: "1,2 triệu người theo dõi",
            cta: "Chuchube!",
            stamp: "Chuchube!",
            toast: "Đã chặn và báo cáo",
          },
          en: {
            shotLabel: "Screenshot",
            fakeName: "Bếp của Mơ - Tri Ân",
            post: "Invest with Mơ, 30% profit every week!",
            checking: "Checking",
            pctLabel: "likely fake",
            reason1: "Created 6 days ago",
            reason2: "Name mimics the official page",
            reason3: "Promises unusual returns",
            officialTitle: "Official channel",
            officialName: "Bếp của Mơ",
            followers: "1.2M followers",
            cta: "Chuchube!",
            stamp: "Chuchube!",
            toast: "Blocked and reported",
          },
        };
        const hf = window.__hyperframes;
        const vars = hf && typeof hf.getVariables === "function" ? hf.getVariables() || {} : {};
        const lang = vars.lang === "en" ? "en" : "vi";
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-str]").forEach((el) => {
          const s = STRINGS[lang][el.getAttribute("data-str")];
          if (s) el.textContent = s;
        });

        // ---- Helpers ----
        const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
        const seg = (t, a, b) => clamp((t - a) / (b - a));
        const inQuad = (k) => k * k;
        const outQuad = (k) => 1 - (1 - k) * (1 - k);
        const outCubic = (k) => 1 - Math.pow(1 - k, 3);
        const inOutSine = (k) => 0.5 - 0.5 * Math.cos(Math.PI * k);
        const f3 = (v) => v.toFixed(3);

        // Visible at the loop start: fade/sink out in [o0,o1], rise back in [i0,i1].
        function outIn(t, o0, o1, i0, i1, dy) {
          if (t < o0) return { o: 1, y: 0 };
          if (t < o1) {
            const k = inQuad(seg(t, o0, o1));
            return { o: 1 - k, y: dy * k };
          }
          if (t < i0) return { o: 0, y: dy };
          if (t < i1) {
            const k = outCubic(seg(t, i0, i1));
            return { o: k, y: dy * (1 - k) };
          }
          return { o: 1, y: 0 };
        }
        function show(el, o, transform) {
          el.style.opacity = f3(o);
          el.style.visibility = o < 0.002 ? "hidden" : "visible";
          if (transform !== undefined) el.style.transform = transform;
        }

        const $ = (id) => document.getElementById(id);
        const shot = $("shot");
        const shotBody = $("shot-body");
        const scan = $("scan");
        const stamp = $("stamp");
        const pct = $("pct");
        const pctNum = $("pct-num");
        const pctLabel = $("pct-label");
        const checking = $("checking");
        const dots = Array.from(checking.querySelectorAll(".dot"));
        const meterFill = $("meter-fill");
        const reasons = Array.from(document.querySelectorAll(".reason"));
        const official = $("official");
        const cta = $("cta");
        const ctaShade = $("cta-shade");
        const toast = $("toast");

        // ---- Storyboard (seconds) ----
        // 0.00-0.30 hold the finished result (poster)
        // 0.30-0.62 "Chuchube!" pressed (0.96 and back)
        // 0.55-0.85 stamp lands on the screenshot; card takes the hit
        // 1.00-1.50 button gives way to the toast "blocked and reported"
        // 2.60-3.30 clean reset: stamp, toast, result, official row leave
        // 3.30-5.10 scan sweeps the screenshot, "Checking..."
        // 5.00-6.55 92% counts up, meter fills, reasons arrive one by one
        // 6.60-7.45 official row, then the button, settle into the frame-0 state
        const COUNT0 = 5.0;
        const COUNT1 = 6.4;

        function renderAt(t) {
          t = clamp(t, 0, DUR);

          // Screenshot card: a small "thud" when the stamp lands; content dims while blocked.
          const bump = Math.sin(Math.PI * seg(t, 0.85, 1.12));
          shot.style.transform = `translateY(${f3(2 * bump)}px) scale(${f3(1 - 0.012 * bump)})`;
          let dim = 1;
          if (t >= 0.85 && t < 2.7) dim = 1 - 0.34 * outCubic(seg(t, 0.85, 1.25));
          else if (t >= 2.7 && t < 3.1) dim = 0.66 + 0.34 * inOutSine(seg(t, 2.7, 3.1));
          shotBody.style.opacity = f3(dim);

          // Stamp: drops from 1.6x and -13deg to 1x and -8deg, then lifts away in the reset.
          if (t >= 0.55 && t < 2.95) {
            let o = 1;
            let s = 1;
            let r = -8;
            if (t < 0.85) {
              const k = inQuad(seg(t, 0.55, 0.85));
              s = 1.6 - 0.6 * k;
              r = -13 + 5 * k;
              o = outQuad(seg(t, 0.55, 0.7));
            } else if (t >= 2.6) {
              const k = seg(t, 2.6, 2.95);
              o = 1 - inOutSine(k);
              s = 1 + 0.04 * k;
            }
            show(stamp, o * 0.94, `rotate(${f3(r)}deg) scale(${f3(s)})`);
          } else {
            show(stamp, 0, "rotate(-13deg) scale(1.6)");
          }

          // Scan: two top-to-bottom sweeps, entering above the card and leaving below it.
          if (t >= 3.4 && t < 5.0) {
            const k = inOutSine(seg(t < 4.2 ? t : t - 0.8, 3.4, 4.2));
            show(scan, 1, `translateY(${f3(-8 + 320 * k)}px)`);
          } else {
            show(scan, 0, "translateY(-8px)");
          }

          // "Checking..." with three breathing dots.
          if (t >= 3.3 && t < 5.12) {
            let o = 1;
            let y = 0;
            if (t < 3.6) {
              const k = outCubic(seg(t, 3.3, 3.6));
              o = k;
              y = 10 * (1 - k);
            } else if (t >= 4.92) {
              const k = inQuad(seg(t, 4.92, 5.12));
              o = 1 - k;
              y = -8 * k;
            }
            show(checking, o, `translateY(${f3(y)}px)`);
            const phase = (t - 3.3) / 0.75;
            dots.forEach((d, i) => {
              const v = 0.5 + 0.5 * Math.sin(2 * Math.PI * (phase - i * 0.16));
              d.style.opacity = f3(0.2 + 0.8 * v);
            });
          } else {
            show(checking, 0, "translateY(10px)");
          }

          // Percentage: counts 0 -> 92 with the meter.
          const p = t >= COUNT0 && t < COUNT1 ? outCubic(seg(t, COUNT0, COUNT1)) : 1;
          pctNum.textContent = String(Math.round(92 * p));
          const sc = outIn(t, 2.92, 3.25, COUNT0, COUNT0 + 0.2, 12);
          show(pct, sc.o, `translateY(${f3(sc.y)}px)`);
          const lb = outIn(t, 2.92, 3.25, COUNT0 + 0.1, COUNT0 + 0.45, 12);
          show(pctLabel, lb.o, `translateY(${f3(lb.y)}px)`);

          meterFill.style.transform = `translateX(${f3(-100 * (1 - p))}%)`;
          let mo = 1;
          if (t >= 2.92 && t < 3.25) mo = 1 - inQuad(seg(t, 2.92, 3.25));
          else if (t >= 3.25 && t < COUNT0) mo = 0;
          meterFill.style.opacity = f3(mo);

          // Reasons: leave bottom-up in the reset, arrive top-down after the count starts.
          reasons.forEach((el, i) => {
            const o0 = 2.76 + 0.06 * (2 - i);
            const i0 = 5.45 + 0.35 * i;
            const st = outIn(t, o0, o0 + 0.3, i0, i0 + 0.4, 14);
            show(el, st.o, `translateY(${f3(st.y)}px)`);
          });

          // Official channel row.
          const of = outIn(t, 2.66, 2.98, 6.6, 7.05, 18);
          show(official, of.o, `translateY(${f3(of.y)}px)`);

          // Button: pressed, gives way to the toast, comes back at the end.
          let press = 0;
          if (t >= 0.3 && t < 0.42) press = outQuad(seg(t, 0.3, 0.42));
          else if (t >= 0.42 && t < 0.62) press = 1 - outCubic(seg(t, 0.42, 0.62));
          const cs = outIn(t, 1.0, 1.25, 6.95, 7.45, 16);
          show(cta, cs.o, `translateY(${f3(cs.y)}px) scale(${f3(1 - 0.04 * press)})`);
          ctaShade.style.opacity = f3(0.18 * press);

          // Toast: rises in, holds, sinks away in the reset.
          if (t >= 1.1 && t < 2.9) {
            let o = 1;
            let y = 0;
            if (t < 1.5) {
              o = outCubic(seg(t, 1.1, 1.35));
              y = 40 * (1 - outCubic(seg(t, 1.1, 1.5)));
            } else if (t >= 2.6) {
              const k = inQuad(seg(t, 2.6, 2.9));
              o = 1 - k;
              y = 20 * k;
            }
            show(toast, o, `translateY(${f3(y)}px)`);
          } else {
            show(toast, 0, "translateY(40px)");
          }
        }

        const clock = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
        window.addEventListener("hf-seek", (e) => renderAt(Number(e.detail && e.detail.time) || 0));
        renderAt(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
